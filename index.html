        function normalizeAnswer(answer) {

            const normalized = normalizeAnswer(userAnswer);
            if (normalizeAnswer(correctAnswer) === normalized) return true;
            for (const pokemon of evolutionTree) {

            }
            return false;

        function PokemonMoveGame() {
            const [gameStarted, setGameStarted] = useState(false);
            const [selectedGeneration, setSelectedGeneration] = useState(null);
            const [availablePuzzles, setAvailablePuzzles] = useState([]);
            const [currentPuzzle, setCurrentPuzzle] = useState(null);
            const [selectedPokemon, setSelectedPokemon] = useState('');
            const [guessAttempts, setGuessAttempts] = useState(0);
            const [lives, setLives] = useState(3);
            const [streak, setStreak] = useState(0);
            const [totalScore, setTotalScore] = useState(0);
            const [gameState, setGameState] = useState('playing');
            const [message, setMessage] = useState('');
            const [currentGuesses, setCurrentGuesses] = useState([]);
            const [leaderboard, setLeaderboard] = useState([]);
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [hintsUsed, setHintsUsed] = useState([]);
            const [revealedHints, setRevealedHints] = useState([]);
            const [showNicknameModal, setShowNicknameModal] = useState(false);
            const [pendingScore, setPendingScore] = useState(null);
            const [usedPuzzles, setUsedPuzzles] = useState(new Set());
            
            useEffect(() => {
                const stored = localStorage.getItem('pokemonGameLeaderboard');
                if (stored) setLeaderboard(JSON.parse(stored));
            }, []);
            
            const startGame = (gen) => {
                setSelectedGeneration(gen);
                const filtered = ALL_PUZZLES.filter(p => p.generation === gen);
                setAvailablePuzzles(filtered);
                setGameStarted(true);
                setLives(3);
                setStreak(0);
                setTotalScore(0);
                setUsedPuzzles(new Set());
                loadNewPuzzle(filtered);
            };
            
            const loadNewPuzzle = (puzzles = availablePuzzles) => {
                if (puzzles.length === 0) return;
                
                // Filtra puzzle già usati
                const unusedPuzzles = puzzles.filter(p => !usedPuzzles.has(p.answer_id));
                
                // Se ho usato tutti i puzzle, resetta
                if (unusedPuzzles.length === 0) {
                    setUsedPuzzles(new Set());
                    setMessage('🎉 Hai completato tutti i puzzle di questa generazione! Ricominciamo...');
                    setTimeout(() => loadNewPuzzle(puzzles), 2000);
                    return;
                }
                
                const puzzle = unusedPuzzles[Math.floor(Math.random() * unusedPuzzles.length)];
                setCurrentPuzzle(puzzle);
                setSelectedPokemon('');
                setGuessAttempts(0);
                setGameState('playing');
                setMessage('');
                setCurrentGuesses([]);
                setHintsUsed([]);
                setRevealedHints([]);
                
                // Marca come usato
                setUsedPuzzles(new Set([...usedPuzzles, puzzle.answer_id]));
            };
            
            const useHint = (hintType) => {
                if (hintsUsed.includes(hintType) || gameState !== 'playing') return;
                setHintsUsed([...hintsUsed, hintType]);
                if (hintType === 'type') {
                    setRevealedHints([...revealedHints, { type: 'type', value: currentPuzzle.pokemon_types.join(' / ') }]);
                } else if (hintType === 'generation') {
                    setRevealedHints([...revealedHints, { type: 'generation', value: `Generazione ${currentPuzzle.pokemon_generation}` }]);
                }
            };
            
            const checkIfInTop10 = (score, streak) => {
                if (leaderboard.length < 10) return true;
                const sortedBoard = [...leaderboard].sort((a, b) => b.streak !== a.streak ? b.streak - a.streak : b.score - a.score);
                const worstEntry = sortedBoard[9];
                return streak > worstEntry.streak || (streak === worstEntry.streak && score > worstEntry.score);
            };
            
            const saveToLeaderboard = (nickname) => {
                const entry = { 
                    nickname: nickname || 'Anonimo', 
                    score: pendingScore.score, 
                    streak: pendingScore.streak, 
                    date: new Date().toISOString(), 
                    generation: selectedGeneration 
                };
                const newLeaderboard = [...leaderboard, entry].sort((a, b) => b.streak !== a.streak ? b.streak - a.streak : b.score - a.score).slice(0, 10);
                setLeaderboard(newLeaderboard);
                localStorage.setItem('pokemonGameLeaderboard', JSON.stringify(newLeaderboard));
                setShowNicknameModal(false);
                setPendingScore(null);
            };
            
            const handleGuess = (e) => {
                e.preventDefault();
                if (gameState !== 'playing' || !selectedPokemon) return;
                const isCorrect = checkAnswer(selectedPokemon, currentPuzzle.answer, currentPuzzle.evolution_tree);
                const newGuessAttempts = guessAttempts + 1;
                setGuessAttempts(newGuessAttempts);
                setCurrentGuesses([...currentGuesses, selectedPokemon]);
                if (isCorrect) {
                    const basePoints = newGuessAttempts === 1 ? 3 : newGuessAttempts === 2 ? 2 : 1;
                    const finalPoints = Math.max(0, basePoints - hintsUsed.length);
                    setTotalScore(totalScore + finalPoints);
                    setStreak(streak + 1);
                    setGameState('won');
                    setMessage(`🎉 Esatto! È ${selectedPokemon}! +${finalPoints} punti`);
                } else {
                    if (newGuessAttempts >= 3) {
                        const newLives = lives - 1;
                        setLives(newLives);
                        if (newLives <= 0) {
                            setGameState('gameover');
                            setMessage(`💀 GAME OVER! La risposta era: ${currentPuzzle.answer}`);
                            if (checkIfInTop10(totalScore, streak)) {
                                setPendingScore({ score: totalScore, streak: streak });
                                setShowNicknameModal(true);
                            } else {
                                saveToLeaderboard('');
                            }
                        } else {
                            setGameState('lost');
                            setMessage(`😔 Sbagliato! Era ${currentPuzzle.answer}. Vite rimaste: ${newLives}`);
                        }
                    } else {
                        setMessage(`❌ Sbagliato! Ti rimangono ${3 - newGuessAttempts} tentativi.`);
                        setSelectedPokemon('');
                    }
                }
            };
            
            if (!gameStarted) return <GenerationSelector onStart={startGame} />;
            if (!currentPuzzle) return <div className="flex items-center justify-center min-h-screen"><div className="text-2xl font-bold text-purple-600">Caricamento...</div></div>;
            
            return (
                <div className="container mx-auto px-4 py-8 max-w-6xl">
                    <NicknameModal show={showNicknameModal} score={pendingScore?.score || 0} streak={pendingScore?.streak || 0} onSave={saveToLeaderboard} onSkip={() => saveToLeaderboard('')} />
                    <div className="text-center mb-6">
                        <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-2">Indovina il Pokémon</h1>
                        <p className="text-sm text-gray-500 mb-4">Gen {selectedGeneration} • {availablePuzzles.length} puzzle</p>
                        <div className="flex justify-center gap-4 flex-wrap">
                            <div className="bg-white rounded-lg px-6 py-3 shadow-lg"><span className="text-gray-600 mr-2">❤️</span><span className="font-bold text-red-600 text-xl">{lives}</span></div>
                            <div className="bg-white rounded-lg px-6 py-3 shadow-lg"><span className="text-gray-600 mr-2">🔥</span><span className="font-bold text-orange-600 text-xl">{streak}</span></div>
                            <div className="bg-white rounded-lg px-6 py-3 shadow-lg"><span className="text-gray-600 mr-2">⭐</span><span className="font-bold text-purple-600 text-xl">{totalScore}</span></div>
                            <button onClick={() => setShowLeaderboard(!showLeaderboard)} className="bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold px-6 py-3 rounded-lg shadow-lg">🏆</button>
                        </div>
                    </div>
                    {showLeaderboard && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-8 max-w-md w-full max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-3xl font-bold text-purple-600">🏆 Classifica</h2>
                                    <button onClick={() => setShowLeaderboard(false)} className="text-gray-500 text-2xl">✕</button>
                                </div>
                                {leaderboard.length > 0 ? (
                                    <div className="space-y-3">
                                        {leaderboard.map((entry, index) => (
                                            <div key={index} className="bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg p-4">
                                                <div className="flex items-center gap-4">
                                                    <div className="text-2xl font-bold text-purple-600 w-8">{index + 1}</div>
                                                    <div className="flex-1">
                                                        <div className="font-bold text-lg">{entry.nickname || 'Anonimo'}</div>
                                                        <div className="text-sm">🔥 {entry.streak} • ⭐ {entry.score} • Gen {entry.generation}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : <p className="text-center text-gray-500 py-8">Nessun punteggio!</p>}
                                <button onClick={() => { localStorage.setItem('pokemonGameLeaderboard', JSON.stringify([])); setLeaderboard([]); }} className="w-full mt-6 bg-red-500 text-white font-bold py-3 px-6 rounded-lg">Azzera</button>
                            </div>
                        </div>
                    )}
                    {gameState === 'playing' && (
                        <div className="mb-6 flex justify-center gap-4 flex-wrap">
                            <button onClick={() => useHint('type')} disabled={hintsUsed.includes('type')} className={`px-6 py-3 rounded-lg font-bold shadow-lg transition-all ${hintsUsed.includes('type') ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-gradient-to-r from-blue-500 to-cyan-500 text-white hover:shadow-xl transform hover:scale-105 pulse-animation'}`}>💡 Tipo (-1pt)</button>
                            <button onClick={() => useHint('generation')} disabled={hintsUsed.includes('generation')} className={`px-6 py-3 rounded-lg font-bold shadow-lg transition-all ${hintsUsed.includes('generation') ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-gradient-to-r from-green-500 to-emerald-500 text-white hover:shadow-xl transform hover:scale-105 pulse-animation'}`}>💡 Gen (-1pt)</button>
                        </div>
                    )}
                    {revealedHints.length > 0 && (
                        <div className="mb-6 flex justify-center gap-4 flex-wrap">
                            {revealedHints.map((hint, i) => (
                                <div key={i} className="bg-yellow-100 border-2 border-yellow-400 rounded-lg px-6 py-3 shadow-lg">
                                    <span className="font-bold text-yellow-800">{hint.type === 'type' ? '🎨 ' : '📅 '}{hint.value}</span>
                                </div>
                            ))}
                        </div>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        {currentPuzzle.moves.map((move, index) => (
                            <div key={index} className={`move-card type-${currentPuzzle.move_types[index].toLowerCase()} rounded-xl p-6 text-white`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div className="text-sm opacity-75">Mossa {index + 1}</div>
                                    <div className="bg-white bg-opacity-20 px-3 py-1 rounded-full text-xs font-semibold uppercase">{currentPuzzle.move_types[index]}</div>
                                </div>
                                <div className="text-2xl font-bold mb-3">{move}</div>
                                <div className="flex gap-3 text-sm flex-wrap">
                                    <div className="bg-white bg-opacity-20 px-3 py-1 rounded-lg">Potenza: <span className="font-bold">{currentPuzzle.move_power[index] !== null ? currentPuzzle.move_power[index] : '—'}</span></div>
                                    <div className="bg-white bg-opacity-20 px-3 py-1 rounded-lg">PP: <span className="font-bold">{currentPuzzle.move_pp[index] !== null ? currentPuzzle.move_pp[index] : '—'}</span></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="flex justify-center mb-6">
                        <div className="bg-white rounded-full px-6 py-3 shadow-lg">
                            <span className="text-gray-600 mr-2">Tentativi:</span>
                            {[0, 1, 2].map((i) => <span key={i} className={`inline-block w-3 h-3 rounded-full mx-1 ${i < guessAttempts ? 'bg-red-500' : 'bg-green-400'}`}></span>)}
                            <span className="ml-2 font-bold text-purple-600">{guessAttempts}/3</span>
                        </div>
                    </div>
                    {currentGuesses.length > 0 && gameState === 'playing' && (
                        <div className="bg-white rounded-xl p-4 shadow-lg mb-6">
                            <div className="text-sm text-gray-600 mb-2">Tentativi:</div>
                            <div className="flex flex-wrap gap-2">{currentGuesses.map((guess, i) => <div key={i} className="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">{guess}</div>)}</div>
                        </div>
                    )}
                    {gameState === 'playing' && (
                        <form onSubmit={handleGuess} className="mb-6">
                            <div className="bg-white rounded-xl p-6 shadow-lg">
                                <PokemonSelect value={selectedPokemon} onChange={setSelectedPokemon} disabled={false} generation={selectedGeneration} />
                                <button type="submit" className="w-full mt-4 bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3 px-6 rounded-lg text-lg shadow-lg hover:shadow-xl transition-all transform hover:scale-105" disabled={!selectedPokemon}>Conferma</button>
                            </div>
                        </form>
                    )}
                    {message && (
                        <div className={`rounded-xl p-6 shadow-lg mb-6 text-center text-xl font-bold ${gameState === 'won' ? 'bg-green-100 text-green-700 success-animation' : gameState === 'gameover' ? 'bg-red-100 text-red-700' : gameState === 'lost' ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700'}`}>{message}</div>
                    )}
                    {(gameState === 'won' || gameState === 'lost' || gameState === 'gameover') && (
                        <div className="bg-white rounded-xl p-6 shadow-lg mb-6">
                            <div className="text-center mb-4">
                                <div className="text-3xl font-bold text-purple-600 mb-2">{currentPuzzle.answer}</div>
                                <div className="flex justify-center gap-2 mb-2">{currentPuzzle.pokemon_types.map((type, i) => <span key={i} className={`type-${type.toLowerCase()} px-4 py-2 rounded-lg text-white font-semibold text-sm`}>{type}</span>)}</div>
                                <div className="text-gray-600">Gen {currentPuzzle.pokemon_generation}</div>
                            </div>
                            {currentPuzzle.evolution_tree.length > 1 && (
                                <div className="flex flex-wrap justify-center gap-3 mt-4">
                                    {currentPuzzle.evolution_tree.map((pokemon, i) => (
                                        <React.Fragment key={i}>
                                            <div className="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg font-semibold">{pokemon}</div>
                                            {i < currentPuzzle.evolution_tree.length - 1 && <span className="text-2xl text-purple-400">→</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                    {gameState === 'won' && <button onClick={() => loadNewPuzzle()} className="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">➡️ Avanti</button>}
                    {gameState === 'lost' && <button onClick={() => loadNewPuzzle()} className="w-full bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">➡️ Avanti (❤️ {lives})</button>}
                    {gameState === 'gameover' && (
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-purple-100 to-pink-100 rounded-xl p-6 text-center">
                                <div className="text-2xl font-bold text-purple-600 mb-2">Game Over!</div>
                                <div className="text-lg text-gray-700">🔥 Streak: <span className="font-bold">{streak}</span> • ⭐ Punti: <span className="font-bold">{totalScore}</span></div>
                            </div>
                            <button onClick={() => { setGameStarted(false); setLives(3); setStreak(0); setTotalScore(0); }} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">🔄 Nuova Partita</button>
                        </div>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<PokemonMoveGame />, document.getElementById('root'));
    </script>
</body>
</html>
