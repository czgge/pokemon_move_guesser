        const PokemonSelect = ({ value, onChange, disabled, generation }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const selectRef = useRef(null);
            const filteredPokemon = pokemonData
                .filter(p => generation === 'all' || p.pokemon_generation <= generation)
                .filter(p => p.answer.toLowerCase().includes(searchTerm.toLowerCase()))
                .sort((a, b) => a.answer.localeCompare(b.answer));
            useEffect(() => {
                const handleClickOutside = (e) => { if (selectRef.current && !selectRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);
            return (
                <div className="custom-select" ref={selectRef}>
                    <input type="text" className="select-search" placeholder="Cerca un Pokémon..." value={searchTerm} onChange={(e) => { setSearchTerm(e.target.value); setIsOpen(true); }} onFocus={() => setIsOpen(true)} disabled={disabled} />
                    {isOpen && !disabled && (
                        <div className="options-list">
                            {filteredPokemon.length > 0 ? filteredPokemon.map(p => (
                                <div key={p.answer} className="option-item" onClick={() => { onChange(p.answer); setSearchTerm(p.answer); setIsOpen(false); }}>{p.answer} (Gen {p.pokemon_generation})</div>

                        </div>

            const [firebaseError, setFirebaseError] = useState(false);

            useEffect(() => {
                loadLeaderboard();
            }, []);

            const loadLeaderboard = async () => {
                if (!database) {
                    setFirebaseError(true);
                    return;
                }
                
                setLoadingLeaderboard(true);
                try {
                    const leaderboardRef = database.ref('leaderboard');
                    const snapshot = await leaderboardRef.orderByChild('score').limitToLast(10).once('value');
                    
                    if (snapshot.exists()) {
                        const scores = [];
                        snapshot.forEach((childSnapshot) => {
                            scores.push({
                                id: childSnapshot.key,
                                ...childSnapshot.val()
                            });
                        });
                        scores.sort((a, b) => b.score - a.score);
                        setLeaderboard(scores);
                        setFirebaseError(false);
                    } else {
                        setLeaderboard([]);
                    }
                } catch (error) {
                    console.error('Errore caricamento classifica:', error);
                    setFirebaseError(true);
                    setLeaderboard([]);
                }
                setLoadingLeaderboard(false);
            };

            const saveScore = async (name, score, streak) => {
                if (!database) return;
                
                try {
                    const scoreData = {
                        name: name,
                        score: score,
                        streak: streak,
                        date: new Date().toLocaleDateString('it-IT'),
                        timestamp: Date.now()
                    };
                    
                    await database.ref('leaderboard').push(scoreData);
                    await loadLeaderboard();
                } catch (error) {
                    console.error('Errore salvataggio punteggio:', error);
                }
            };

            const handleNameSubmit = (e) => {
                e.preventDefault();
                if (playerName.trim().length >= 2) {
                    setShowNameInput(false);
                }
            };

            const loadNewPuzzle = () => {
                const filteredPokemon = pokemonData.filter(p => !usedPuzzles.includes(p.answer) && p.pokemon_generation <= selectedGeneration);
                if (filteredPokemon.length === 0) {
                    alert('Hai completato tutti i Pokémon disponibili!');
                    setGameStarted(false);
                    setUsedPuzzles([]);
                    return;
                }
                const newPuzzle = filteredPokemon[Math.floor(Math.random() * filteredPokemon.length)];
                setCurrentPuzzle(newPuzzle);
                setUsedPuzzles([...usedPuzzles, newPuzzle.answer]);
                setGameState('playing');
                setSelectedPokemon('');
                setCurrentGuesses([]);
                setMessage('');
            };

            const handleGuess = (e) => {
                e.preventDefault();
                if (!selectedPokemon) return;
                if (selectedPokemon.toLowerCase() === currentPuzzle.answer.toLowerCase()) {
                    const newStreak = streak + 1;
                    const points = 100 + (newStreak * 10);
                    setStreak(newStreak);
                    setTotalScore(totalScore + points);
                    setGameState('won');
                    setMessage(`🎉 Corretto! +${points} punti (Streak: ${newStreak})`);
                } else {
                    setCurrentGuesses([...currentGuesses, selectedPokemon]);
                    if (currentGuesses.length >= 2) {
                        const newLives = lives - 1;
                        setLives(newLives);
                        if (newLives === 0) {
                            setGameState('gameover');
                            setMessage(`💀 Game Over! Era ${currentPuzzle.answer}`);
                            if (playerName && database) {
                                saveScore(playerName, totalScore, streak);
                            }
                        } else {
                            setGameState('lost');
                            setMessage(`❌ Sbagliato! Era ${currentPuzzle.answer}`);
                            setStreak(0);
                        }
                    } else {
                        setMessage(`❌ Sbagliato! Hai ancora ${2 - currentGuesses.length} tentativo/i`);
                    }
                    setSelectedPokemon('');
                }
            };

            if (showNameInput) {
                return (
                    <div className="max-w-2xl mx-auto p-4 min-h-screen flex items-center justify-center">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full">
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                                    🎮 Indovina il Pokémon
                                </h1>
                                <p className="text-gray-600">dalle Mosse</p>
                            </div>
                            
                            {firebaseError && (
                                <div className="bg-red-50 border-2 border-red-300 rounded-xl p-4 mb-6">
                                    <p className="text-red-700 font-semibold text-center">
                                        ⚠️ Errore di connessione al database
                                    </p>
                                    <p className="text-red-600 text-sm text-center mt-2">
                                        Verifica firebase-config.js
                                    </p>
                                </div>
                            )}
                            
                            <form onSubmit={handleNameSubmit} className="space-y-6">
                                <div>
                                    <label className="block text-lg font-semibold text-gray-700 mb-2">
                                        Inserisci il tuo nome
                                    </label>
                                    <input
                                        type="text"
                                        value={playerName}
                                        onChange={(e) => setPlayerName(e.target.value)}
                                        placeholder="Il tuo nome..."
                                        className="w-full px-4 py-3 text-lg border-2 border-purple-300 rounded-xl focus:border-purple-600 focus:outline-none transition-colors"
                                        minLength={2}
                                        maxLength={20}
                                        required
                                    />
                                    <p className="text-sm text-gray-500 mt-2">Minimo 2 caratteri, massimo 20</p>
                                </div>
                                <button
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105"
                                    disabled={playerName.trim().length < 2}
                                >
                                    Inizia a Giocare! 🚀
                                </button>
                            </form>
                            <div className="mt-8 text-center">
                                <button
                                    onClick={() => { setShowLeaderboard(true); loadLeaderboard(); }}
                                    className="text-purple-600 hover:text-purple-800 font-semibold underline"
                                >
                                    📊 Classifica Globale
                                </button>
                            </div>
                            
                            {showLeaderboard && (
                                <div className="mt-6 bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold text-purple-600">🏆 Classifica</h2>
                                        <button onClick={() => setShowLeaderboard(false)} className="text-gray-500 hover:text-gray-700 text-2xl">✕</button>
                                    </div>
                                    {loadingLeaderboard ? (
                                        <div className="text-center py-8">
                                            <div className="loading-spinner"></div>
                                            <p className="text-gray-600 mt-4">Caricamento...</p>
                                        </div>
                                    ) : leaderboard.length > 0 ? (
                                        <div className="space-y-2">
                                            {leaderboard.map((entry, index) => (
                                                <div key={entry.id} className="leaderboard-entry bg-white rounded-lg p-4 flex items-center justify-between shadow-sm">
                                                    <div className="flex items-center gap-3">
                                                        <span className={`text-2xl font-bold ${index === 0 ? 'text-yellow-500' : index === 1 ? 'text-gray-400' : index === 2 ? 'text-orange-600' : 'text-gray-600'}`}>
                                                            {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`}
                                                        </span>
                                                        <div>
                                                            <div className="font-bold text-gray-800">{entry.name}</div>
                                                            <div className="text-sm text-gray-500">{entry.date}</div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-xl font-bold text-purple-600">{entry.score}</div>
                                                        <div className="text-sm text-gray-500">🔥 {entry.streak}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-8 text-gray-600">
                                            {firebaseError ? 'Errore connessione' : 'Nessun punteggio 🎯'}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (!gameStarted) {
                return (
                    <div className="max-w-2xl mx-auto p-4 min-h-screen flex items-center justify-center">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full">
                            <div className="text-center mb-8">
                                <div className="text-sm text-gray-600 mb-2">Benvenuto, {playerName}! 👋</div>
                                <h1 className="text-4xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">🎮 Indovina il Pokémon</h1>
                                <p className="text-gray-600">dalle Mosse</p>
                            </div>
                            <div className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6 mb-6">
                                <h2 className="text-xl font-bold text-purple-600 mb-3">📜 Come si gioca</h2>
                                <ul className="space-y-2 text-gray-700">
                                    <li>🎯 Indovina il Pokémon dalle mosse</li>
                                    <li>❤️ Hai 3 vite e 3 tentativi per puzzle</li>
                                    <li>🔥 Le vittorie consecutive aumentano i punti</li>
                                    <li>🏆 Compete con giocatori di tutto il mondo</li>
                                </ul>
                            </div>
                            <div className="mb-6">
                                <label className="block text-center font-bold text-gray-700 mb-3 text-lg">Generazione</label>
                                <div className="grid grid-cols-4 gap-2">
                                    {[1, 2, 3, 4, 5, 6, 7, 8, 'all'].map(gen => (
                                        <button key={gen} onClick={() => setSelectedGeneration(gen === 'all' ? 'all' : gen)} className={`gen-button py-3 px-4 rounded-lg font-bold transition-all ${selectedGeneration === gen ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg scale-105' : 'bg-purple-100 text-purple-600 hover:bg-purple-200'}`}>{gen === 'all' ? 'Tutte' : `Gen ${gen}`}</button>
                                    ))}
                                </div>
                            </div>
                            <button onClick={() => { setGameStarted(true); loadNewPuzzle(); }} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">🚀 Inizia!</button>
                            
                            <div className="mt-6 text-center space-y-3">
                                <button onClick={() => { setShowLeaderboard(!showLeaderboard); if (!showLeaderboard) loadLeaderboard(); }} className="text-purple-600 hover:text-purple-800 font-semibold underline">
                                    📊 {showLeaderboard ? 'Nascondi' : 'Mostra'} Classifica
                                </button>
                                <div>
                                    <button onClick={() => setShowNameInput(true)} className="text-gray-500 hover:text-gray-700 text-sm">
                                        Cambia nome
                                    </button>
                                </div>
                            </div>

                            {showLeaderboard && (
                                <div className="mt-6 bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6">
                                    <h2 className="text-2xl font-bold text-purple-600 mb-4">🏆 Top 10</h2>
                                    {loadingLeaderboard ? (
                                        <div className="text-center py-8">
                                            <div className="loading-spinner"></div>
                                        </div>
                                    ) : leaderboard.length > 0 ? (
                                        <div className="space-y-2">
                                            {leaderboard.map((entry, index) => (
                                                <div key={entry.id} className="leaderboard-entry bg-white rounded-lg p-4 flex items-center justify-between shadow-sm">
                                                    <div className="flex items-center gap-3">
                                                        <span className={`text-2xl font-bold ${index === 0 ? 'text-yellow-500' : index === 1 ? 'text-gray-400' : index === 2 ? 'text-orange-600' : 'text-gray-600'}`}>
                                                            {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`}
                                                        </span>
                                                        <div>
                                                            <div className="font-bold text-gray-800">{entry.name}</div>
                                                            <div className="text-sm text-gray-500">{entry.date}</div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-xl font-bold text-purple-600">{entry.score}</div>
                                                        <div className="text-sm text-gray-500">🔥 {entry.streak}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-8 text-gray-600">
                                            {firebaseError ? 'Errore' : 'Nessun punteggio 🎯'}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto p-4 py-8">
                    <div className="bg-white rounded-2xl shadow-2xl p-6 mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <div className="text-3xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">🎮 Pokémon</div>
                            <button onClick={() => { setShowLeaderboard(!showLeaderboard); if (!showLeaderboard) loadLeaderboard(); }} className="text-purple-600 hover:text-purple-800 font-semibold text-sm">📊</button>
                        </div>
                        <div className="flex justify-between items-center text-sm">
                            <div className="font-semibold text-gray-700">{playerName}</div>
                            <div className="flex gap-4">
                                <div className="font-semibold">❤️ {lives}</div>
                                <div className="font-semibold">🔥 {streak}</div>
                                <div className="font-semibold">⭐ {totalScore}</div>
                            </div>
                        </div>
                    </div>

                    {showLeaderboard && (
                        <div className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold text-purple-600">🏆 Top 10</h2>
                                <button onClick={() => setShowLeaderboard(false)} className="text-gray-500 hover:text-gray-700">✕</button>
                            </div>
                            {loadingLeaderboard ? (
                                <div className="text-center py-4"><div className="loading-spinner"></div></div>
                            ) : leaderboard.length > 0 ? (
                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {leaderboard.map((entry, index) => (
                                        <div key={entry.id} className="leaderboard-entry bg-white rounded-lg p-3 flex items-center justify-between shadow-sm">
                                            <div className="flex items-center gap-2">
                                                <span className={`text-lg font-bold ${index === 0 ? 'text-yellow-500' : index === 1 ? 'text-gray-400' : index === 2 ? 'text-orange-600' : 'text-gray-600'}`}>
                                                    {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`}
                                                </span>
                                                <div>
                                                    <div className="font-bold text-sm">{entry.name}</div>
                                                    <div className="text-xs text-gray-500">{entry.date}</div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-bold text-purple-600">{entry.score}</div>
                                                <div className="text-xs text-gray-500">🔥 {entry.streak}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-4 text-gray-600">🎯</div>
                            )}
                        </div>
                    )}

                    <div className="bg-white rounded-xl p-6 shadow-lg mb-6">
                        <h2 className="text-2xl font-bold text-center text-purple-600 mb-4">🎯 Indovina!</h2>
                        <div className="grid grid-cols-2 gap-3">
                            {currentPuzzle?.moves.map((move, i) => (
                                <div key={i} className="move-card bg-gradient-to-br from-purple-400 to-pink-500 text-white p-4 rounded-lg text-center font-bold shadow-md">{move}</div>
                            ))}
                        </div>
                    </div>
                    {currentGuesses.length > 0 && (
                        <div className="bg-red-50 rounded-xl p-4 mb-6">
                            <div className="text-red-700 font-semibold mb-2">Errati:</div>
                            <div className="flex flex-wrap gap-2">{currentGuesses.map((guess, i) => <div key={i} className="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">{guess}</div>)}</div>
                        </div>
                    )}
                    {gameState === 'playing' && (
                        <form onSubmit={handleGuess} className="mb-6">
                            <div className="bg-white rounded-xl p-6 shadow-lg">
                                <PokemonSelect value={selectedPokemon} onChange={setSelectedPokemon} disabled={false} generation={selectedGeneration} />
                                <button type="submit" className="w-full mt-4 bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3 px-6 rounded-lg text-lg shadow-lg hover:shadow-xl transition-all transform hover:scale-105" disabled={!selectedPokemon}>Conferma</button>
                            </div>
                        </form>
                    )}
                    {message && (
                        <div className={`rounded-xl p-6 shadow-lg mb-6 text-center text-xl font-bold ${gameState === 'won' ? 'bg-green-100 text-green-700 success-animation' : gameState === 'gameover' ? 'bg-red-100 text-red-700' : gameState === 'lost' ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700'}`}>{message}</div>
                    )}
                    {(gameState === 'won' || gameState === 'lost' || gameState === 'gameover') && (
                        <div className="bg-white rounded-xl p-6 shadow-lg mb-6">
                            <div className="text-center mb-4">
                                <div className="text-3xl font-bold text-purple-600 mb-2">{currentPuzzle.answer}</div>
                                <div className="flex justify-center gap-2 mb-2">{currentPuzzle.pokemon_types.map((type, i) => <span key={i} className={`type-${type.toLowerCase()} px-4 py-2 rounded-lg text-white font-semibold text-sm`}>{type}</span>)}</div>
                                <div className="text-gray-600">Gen {currentPuzzle.pokemon_generation}</div>
                            </div>
                            {currentPuzzle.evolution_tree.length > 1 && (
                                <div className="flex flex-wrap justify-center gap-3 mt-4">
                                    {currentPuzzle.evolution_tree.map((pokemon, i) => (
                                        <React.Fragment key={i}>
                                            <div className="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg font-semibold">{pokemon}</div>
                                            {i < currentPuzzle.evolution_tree.length - 1 && <span className="text-2xl text-purple-400">→</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                    {gameState === 'won' && <button onClick={() => loadNewPuzzle()} className="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">➡️ Avanti</button>}
                    {gameState === 'lost' && <button onClick={() => loadNewPuzzle()} className="w-full bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">➡️ Avanti (❤️ {lives})</button>}
                    {gameState === 'gameover' && (
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-purple-100 to-pink-100 rounded-xl p-6 text-center">
                                <div className="text-2xl font-bold text-purple-600 mb-2">Game Over!</div>
                                <div className="text-lg text-gray-700">🔥 {streak} • ⭐ {totalScore}</div>
                                {database && !firebaseError && (
                                    <div className="text-sm text-gray-600 mt-2">Punteggio salvato! 🏆</div>
                                )}
                            </div>
                            <button onClick={() => { setGameStarted(false); setLives(3); setStreak(0); setTotalScore(0); loadLeaderboard(); }} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">🔄 Nuova Partita</button>
                        </div>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<PokemonMoveGame />, document.getElementById('root'));
    </script>
</body>
</html>
